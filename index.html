      function App() {
        // ---------- Estado del componente ----------
        const [cart, setCart] = useState([]);
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
        const [selectedProduct, setSelectedProduct] = useState(null);
        const [activeFilter, setActiveFilter] = useState('all');
        const [toastMessage, setToastMessage] = useState(null);
        const [newsletterEmail, setNewsletterEmail] = useState('');
        const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });

        // ---------- Efectos y temporizadores ----------
        useEffect(() => {
          if (toastMessage) {
            const timer = setTimeout(() => setToastMessage(null), 3500);
            return () => clearTimeout(timer);
          }
        }, [toastMessage]);

        const triggerToast = (msg) => {
          setToastMessage(msg);
        };

        const addToCart = (product) => {
          const existingItem = cart.find(item => item.id === product.id);
          if (existingItem) {
            setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
          } else {
            setCart([...cart, { ...product, qty: 1 }]);
          }
          triggerToast(`¡\"${product.name}\" añadido al carrito! ✨`);
        };

        const updateCartQty = (id, change) => {
          const updated = cart.map(item => {
            if (item.id === id) {
              const newQty = item.qty + change;
              return newQty > 0 ? { ...item, qty: newQty } : null;
            }
            return item;
          }).filter(Boolean);
          setCart(updated);
        };

        const removeFromCart = (id) => {
          setCart(cart.filter(item => item.id !== id));
          triggerToast('Producto eliminado del carrito');
        };

        const getCartTotal = () => {
          return cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        };

        const handleCheckout = () => {
          if (cart.length === 0) return;

          let message = `*B.caapi - Nueva Orden de Compra* 🌿\n`;
          message += `Hola, me gustaría encargar las siguientes piezas artesanales de su tienda online:\n\n`;

          cart.forEach((item, index) => {
            message += `${index + 1}. *${item.name}* \n   Cantidad: ${item.qty} | Subtotal: $${(item.price * item.qty).toFixed(2)} ${B_CAAPI_DATA.brandInfo.currency}\n`;
          });

          const total = getCartTotal();
          const isFreeShipping = total >= B_CAAPI_DATA.brandInfo.shippingThreshold;

          message += `\n-----------------------------\n`;
          message += `*Total Productos:* $${total.toFixed(2)} ${B_CAAPI_DATA.brandInfo.currency}\n`;
          message += `*Envío:* ${isFreeShipping ? '¡GRATIS! 🎉' : 'A calcular por el asesor 🚚'}\n\n`;
          message += `*Por favor, confírmenme disponibilidad para acordar la entrega y el pago.* 🤍`;

          const encodedMessage = encodeURIComponent(message);
          const whatsappUrl = `https://wa.me/${B_CAAPI_DATA.brandInfo.whatsapp}?text=${encodedMessage}`;
          window.open(whatsappUrl, '_blank');
        };

        const handleContactSubmit = (e) => {
          e.preventDefault();
          const message = `*B.caapi - Mensaje de Contacto* ✉️\n\n*Nombre:* ${contactForm.name}\n*Email:* ${contactForm.email}\n*Mensaje:* ${contactForm.message}`;
          const encodedMessage = encodeURIComponent(message);
          const whatsappUrl = `https://wa.me/${B_CAAPI_DATA.brandInfo.whatsapp}?text=${encodedMessage}`;
          window.open(whatsappUrl, '_blank');
          setContactForm({ name: '', email: '', message: '' });
          triggerToast('¡Enlace a WhatsApp generado con tu consulta! 💬');
        };

        // ---------- UI principal del App ----------
        return (
          <div className="min-h-screen bg-[#F9F7EB] text-[#5A382B] font-sans-boho relative overflow-x-hidden antialiased">

                    </svg>

            {/* HERO PRINCIPAL */}
            <section className="relative min-h-[80vh] flex items-center justify-center pt-8 pb-12 px-6 overflow-hidden bg-gradient-to-b from-[#F9F7EB] via-[#EEE6D8]/60 to-[#F9F7EB]">

                </svg>
              </div>

              <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">

                  <div className="space-y-3">
                    <span className="text-xs uppercase tracking-[0.3em] text-[#7F7C51] font-bold block">Accesorios de diseño con alma</span>

                  </p>

                  <div className="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-4">
                    <a
                      href="#productos"
                      className="w-full sm:w-auto text-center text-xs uppercase tracking-[0.25em] font-semibold bg-[#7F7C51] text-[#F9F7EB] hover:bg-[#603F2E] px-8 py-4 rounded-full transition-all duration-300 shadow-lg hover:shadow-xl"
                    >
                      Explorar Colecciones
                    </a>
                    <a
                      href="#historia"
                      className="w-full sm:w-auto text-center text-xs uppercase tracking-[0.25em] font-semibold border border-[#603F2E]/30 text-[#603F2E] hover:bg-[#EEE6D8] px-8 py-4 rounded-full transition-all duration-300"
                    >
                      Conoce B.caapi
                    </a>
                  </div>

                  <div className="grid grid-cols-3 gap-6 pt-8 border-t border-[#D7CAA8]/40 max-w-md mx-auto lg:mx-0">
                    <div className="text-center lg:text-left">
                      <span className="block font-serif-boho text-2xl font-bold text-[#7F7C51]">100%</span>
                      <span className="text-[10px] tracking-wider uppercase text-[#8A7A55]">Hecho a mano</span>
                    </div>
                    <div className="text-center lg:text-left">
                      <span className="block font-serif-boho text-2xl font-bold text-[#7F7C51]">Gemas</span>
                      <span className="text-[10px] tracking-wider uppercase text-[#8A7A55]">Semipreciosas</span>
                    </div>
                    <div className="text-center lg:text-left">
                      <span className="block font-serif-boho text-2xl font-bold text-[#7F7C51]">Edición</span>
                      <span className="text-[10px] tracking-wider uppercase text-[#8A7A55]">Limitada</span>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6 relative flex justify-center items-center h-[450px] sm:h-[600px] w-full">
                  <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[85%] h-[85%] border-2 border-[#D7CAA8]/30 rounded-[2rem] pointer-events-none"></div>
                  <div className="absolute w-[60%] h-[75%] top-4 left-6 rounded-[2rem] overflow-hidden shadow-2xl transition-transform duration-500 hover:scale-105 z-20">
                    <img
                      src="https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?auto=format&fit=crop&w=700&q=80"
                      alt="B.caapi Arte Principal"
                      className="w-full h-full object-cover"
                      onError={(e) => { e.target.src = "https://placehold.co/600x800/A3663F/F0E9DF?text=B.caapi+Artesania"; }}
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-transparent"></div>
                  </div>

                  <div className="absolute w-[45%] h-[55%] bottom-10 right-6 rounded-[2rem] overflow-hidden shadow-2xl transition-transform duration-500 hover:scale-105 border-4 border-[#F9F7EB] z-30">
                    <img
                      src="https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80"
                      alt="B.caapi Detalle Algodón"
                      className="w-full h-full object-cover"
                      onError={(e) => { e.target.src = "https://placehold.co/400x500/907957/F0E9DF?text=Detalle+B.cotton"; }}
                    />
                  </div>

                  <div className="absolute top-10 right-16 z-10 w-24 h-24 bg-[#A39A70]/30 rounded-full blur-2xl"></div>
                  <div className="absolute bottom-6 left-16 z-10 w-32 h-32 bg-[#8F7D63]/20 rounded-full blur-3xl"></div>
                </div>
              </div>
            </section>

            {/* VALORES DE LA MARCA */}
            <section className="bg-[#EEE6D8]/40 py-16 px-6 border-y border-[#D7CAA8]/30">
              <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-12">
                {B_CAAPI_DATA.brandValues.map((value, i) => (
                  <div key={i} className="flex flex-col items-center text-center space-y-4 p-6 hover:bg-[#F9F7EB] rounded-2xl transition-all duration-300 boho-glow">
                    <div className="w-16 h-16 rounded-full bg-[#8F7D63]/20 flex items-center justify-center text-[#7F7C51]">
                      {value.icon === "hand-heart" && (
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-8 h-8">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />

                        </svg>

                  </div>

            </section>

            {/* SECCIÓN DE HISTORIA / NOSOTROS */}

              <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                <div className="grid grid-cols-2 gap-4 relative">
                  <div className="absolute -top-10 -left-10 w-24 h-24 bg-[#7F7C51]/10 rounded-full blur-2xl"></div>
                  <div className="space-y-4">
                    <div className="rounded-[1.5rem] overflow-hidden shadow-md">
                      <img
                        src="https://images.unsplash.com/photo-1509319117193-57bab727e09d?auto=format&fit=crop&w=500&q=80"
                        alt="Inspiración Natural"
                        className="w-full h-64 object-cover hover:scale-105 transition-transform duration-500"
                      />
                    </div>
                    <div className="rounded-[1.5rem] overflow-hidden shadow-md">
                      <img
                        src="https://images.unsplash.com/photo-1617038260897-41a1f14a8ca0?auto=format&fit=crop&w=500&q=80"
                        alt="Proceso de Trenzado"
                        className="w-full h-80 object-cover hover:scale-105 transition-transform duration-500"
                      />
                    </div>
                  </div>
                  <div className="space-y-4 pt-8">
                    <div className="rounded-[1.5rem] overflow-hidden shadow-md">
                      <img
                        src="https://images.unsplash.com/photo-1602751584552-8ba73aad10e1?auto=format&fit=crop&w=500&q=80"
                        alt="Colección en mano"
                        className="w-full h-80 object-cover hover:scale-105 transition-transform duration-500"
                      />
                    </div>
                    <div className="bg-[#7F7C51] text-[#F9F7EB] p-6 rounded-[1.5rem] flex flex-col justify-center text-center">
                      <p className="font-serif-boho italic text-lg text-[#F9F7EB]">"La naturaleza no tiene prisa, y aun así todo se logra."</p>
                      <span className="text-[9px] uppercase tracking-widest mt-4 opacity-80">— Filosofía B.caapi</span>
                    </div>
                  </div>
                </div>

                <div className="space-y-8">
                  <div className="space-y-2">
                    <span className="text-xs uppercase tracking-[0.3em] text-[#7F7C51] font-bold">Uniendo Alma y Diseño</span>
                    <h2 className="font-serif-boho text-3xl sm:text-5xl font-bold text-[#603F2E] leading-tight">{B_CAAPI_DATA.brandStory.originTitle}</h2>
                  </div>

                  <div className="space-y-6 text-[#8A7A55] font-light leading-relaxed text-base md:text-lg">
                    <p>{B_CAAPI_DATA.brandStory.paragraph1}</p>
                    <p>{B_CAAPI_DATA.brandStory.paragraph2}</p>
                  </div>

                  <div className="border-l-4 border-[#7F7C51] pl-6 py-2 bg-[#EEE6D8]/30 rounded-r-xl">
                    <p className="font-serif-boho italic text-[#603F2E] text-lg leading-relaxed">{B_CAAPI_DATA.brandStory.quote}</p>
                  </div>

                  <div>
                    <a href="#contacto" className="inline-flex items-center space-x-3 text-xs uppercase tracking-[0.25em] font-semibold text-[#7F7C51] hover:text-[#603F2E] transition-colors group">
                      <span>Conoce a nuestras artesanas</span>
                      <span className="transform group-hover:translate-x-1 transition-transform">→</span>
                    </a>
                  </div>
                </div>
              </div>
            </section>

            {/* SECCIÓN DE COLECCIONES */}
            <section id="colecciones" className="py-24 px-6 bg-[#EEE6D8]/30 border-y border-[#D7CAA8]/40">
              <div className="max-w-7xl mx-auto space-y-16">

                  <p className="text-[#8A7A55] font-light text-sm sm:text-base">Nuestras piezas se agrupan en colecciones diseñadas para resonar con tu estilo personal y el propósito que desees proyectar.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                  {B_CAAPI_DATA.collections.map((col) => (
                    <div key={col.id} className="group relative h-[500px] rounded-[2rem] overflow-hidden shadow-lg transition-all duration-500 hover:shadow-2xl flex flex-col justify-end p-8">
                      <div className="absolute inset-0">
                        <img
                          src={col.bannerImage}
                          alt={col.name}
                          className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                          onError={(e) => { e.target.src = `https://placehold.co/600x800/E7DCCC/5C3922?text=${encodeURIComponent(col.name)}`; }}

                        <div className="absolute inset-0 bg-gradient-to-t from-[#604A34]/95 via-[#604A34]/60 to-transparent"></div>
                      </div>
                      <div className="relative z-10 space-y-4 text-[#F9F7EB]">

                        <div className="pt-2">

                              document.getElementById('productos').scrollIntoView({ behavior: 'smooth' });

                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* SECCIÓN DE PRODUCTOS / CATÁLOGO */}

                  </div>
                  <div className="flex flex-wrap items-center justify-center gap-2">
                    <button
                      onClick={() => setActiveFilter('all')}

                    >
                      Todos
                    </button>
                    {B_CAAPI_DATA.collections.map(col => (
                      <button
                        key={col.id}
                        onClick={() => setActiveFilter(col.id)}
                        className={`px-5 py-2.5 rounded-full text-xs tracking-widest uppercase transition-all duration-300 ${activeFilter === col.id ? 'bg-[#7F7C51] text-[#F9F7EB] shadow-md' : 'bg-[#EEE6D8]/60 text-[#603F2E] hover:bg-[#EEE6D8]'}`}
                      >
                        {col.name}
                      </button>
                    ))}
                  </div>
                </div>

                    const productCollection = B_CAAPI_DATA.collections.find(c => c.id === product.collection);
                    return (
                      <div key={product.id} className="group bg-[#EEE6D8]/30 rounded-[1.8rem] border border-[#D7CAA8]/20 overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col h-full">

                          )}
                          <img
                            src={product.mainImage}
                            alt={product.name}
                            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                            onError={(e) => { e.target.src = `https://placehold.co/600x600/CAA88D/5C3922?text=${encodeURIComponent(product.name)}`; }}
                          />
                          <button
                            onClick={() => setSelectedProduct(product)}
                            className="absolute bottom-4 left-4 right-4 bg-[#F9F7EB]/90 backdrop-blur-sm text-[#5A382B] hover:bg-[#7F7C51] hover:text-[#F9F7EB] py-3 rounded-xl text-xs uppercase tracking-widest font-bold opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0"

                            Detalles de pieza

                            <h3 className="font-serif-boho text-xl font-bold text-[#4F7A53] line-clamp-1">{product.name}</h3>
                            <p className="text-xs text-[#8A7A55] line-clamp-2 leading-relaxed font-light">{product.description}</p>

                            >
                              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                              </svg>
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}

              </div>

                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {selectedProduct && (
              <div className="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4">
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setSelectedProduct(null)}></div>
                <div className="relative bg-[#F9F7EB] w-full max-w-4xl rounded-[2.5rem] overflow-hidden shadow-2xl z-10 grid grid-cols-1 md:grid-cols-2">
                  <button
                    onClick={() => setSelectedProduct(null)}
                    className="absolute top-4 right-4 z-20 bg-[#F9F7EB]/80 hover:bg-[#7F7C51] text-[#603F2E] hover:text-[#F9F7EB] p-2.5 rounded-full transition-all"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                  <div className="bg-white aspect-square md:aspect-auto md:h-full relative overflow-hidden">
                    <img
                      src={selectedProduct.mainImage}
                      alt={selectedProduct.name}
                      className="w-full h-full object-cover"
                    />
                  </div>
                  <div className="p-8 sm:p-12 flex flex-col justify-between space-y-8 overflow-y-auto max-h-[85vh] md:max-h-none">
                    <div className="space-y-4">
                      <span className="text-[10px] tracking-widest uppercase text-[#8A7A55] font-semibold block">Colección {B_CAAPI_DATA.collections.find(c => c.id === selectedProduct.collection)?.name}</span>
                      <h3 className="font-serif-boho text-2xl sm:text-3xl font-bold text-[#603F2E]">{selectedProduct.name}</h3>
                      <p className="font-serif-boho text-2xl text-[#7F7C51] font-bold">{B_CAAPI_DATA.brandInfo.currencySymbol}{selectedProduct.price.toFixed(2)} {B_CAAPI_DATA.brandInfo.currency}</p>
                      <p className="text-sm text-[#8A7A55] font-light leading-relaxed">{selectedProduct.description}</p>
                      <div className="space-y-2 pt-2">
                        <span className="text-xs uppercase tracking-widest text-[#603F2E] font-bold block">Materiales Nobles:</span>
                        <ul className="text-xs text-[#8A7A55] font-light space-y-1 pl-4 list-disc">
                          {selectedProduct.materials.map((m, idx) => (<li key={idx}>{m}</li>))}
                        </ul>
                      </div>
                      <div className="space-y-1">
                        <span className="text-xs uppercase tracking-widest text-[#603F2E] font-bold block">Dimensiones / Talla:</span>
                        <p className="text-xs text-[#8A7A55] font-light">{selectedProduct.size}</p>
                      </div>
                    </div>
                    <div className="space-y-3">
                      <button
                        onClick={() => {
                          addToCart(selectedProduct);
                          setSelectedProduct(null);
                        }}
                        className="w-full py-4 bg-[#7F7C51] hover:bg-white text-[#603F2E] text-xs uppercase tracking-[0.2em] font-bold rounded-xl transition-all duration-300"
                      >
                        Añadir al Carrito
                      </button>
                      <p className="text-[10px] text-center text-[#8A7A55] font-light">Cada accesorio de B.caapi se entrega en su saco de tela rústica con aroma a Palo Santo, listo para regalar o regalarte.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <footer className="bg-white text-[#603F2E] border-t border-[#D7CAA8]/20">
              <div className="max-w-7xl mx-auto px-6 py-16 border-b border-[#D7CAA8]/10 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                <div className="space-y-3 text-center lg:text-left">
                  <h3 className="font-serif-boho text-2xl sm:text-3xl font-bold tracking-wide">Únete al Círculo B.caapi</h3>
                  <p className="text-[#D7CAA8] text-sm font-light max-w-md">Recibe adelantos de colecciones exclusivas, rituales de cuidado de joyas y promociones privadas antes que nadie.</p>
                </div>
                <div className="w-full">
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      setNewsletterEmail('');
                      triggerToast('¡Gracias por sumarte a nuestra comunidad! 🤍');
                    }}
                    className="flex flex-col sm:flex-row gap-3"
                  >
                    <input
                      type="email"
                      required
                      value={newsletterEmail}
                      onChange={(e) => setNewsletterEmail(e.target.value)}
                      className="w-full bg-[#F9F7EB]/10 border border-[#D7CAA8]/20 rounded-xl px-5 py-4 text-sm text-[#603F2E] focus:outline-none focus:border-[#7F7C51] placeholder-[#8F7D63]/60"
                      placeholder="Ingresa tu correo aquí..."
                    />
                    <button
                      type="submit"
                      className="sm:w-auto bg-[#7F7C51] hover:bg-[#F9F7EB] hover:text-[#603F2E] text-white text-xs uppercase tracking-widest font-bold px-8 py-4 rounded-xl transition-all duration-300"
                    >
                      Suscribirse
                    </button>
                  </form>
                </div>
              </div>

              <div className="max-w-7xl mx-auto px-6 py-16 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-12">
                <div className="space-y-6">
                  <h3 className="font-serif-boho text-2xl tracking-widest text-[#603F2E]">B.caapi</h3>
                  <p className="text-sm text-[#603F2E] leading-relaxed font-light">Fusión de cuerdas, fibras naturales y piedras semipreciosas en talismanes para tu piel. Arte portable inspirado en la sinuosidad de la selva.</p>
                  <div className="flex space-x-4">
                    <a href={`https://instagram.com/${B_CAAPI_DATA.brandInfo.instagram.substring(1)}`} target="_blank" rel="noreferrer" className="w-10 h-10 rounded-full bg-[#F9F7EB]/10 flex items-center justify-center hover:bg-[#7F7C51] text-white transition-colors">
                      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z" />
                      </svg>
                    </a>
                  </div>
                </div>
                <div>
                  <h4 className="text-xs uppercase tracking-widest text-[#8F7D63] font-bold mb-6">Colecciones</h4>
                  <ul className="space-y-3 text-sm text-[#603F2E] font-light">
                    {B_CAAPI_DATA.collections.map(col => (
                      <li key={col.id}>
                        <button
                          onClick={() => {
                            setActiveFilter(col.id);
                            document.getElementById('productos').scrollIntoView({ behavior: 'smooth' });
                          }}
                          className="hover:text-[#7F7C51] hover:underline transition-all"
                        >
                          Colección {col.name}
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <h4 className="text-xs uppercase tracking-widest text-[#8F7D63] font-bold mb-6">Información</h4>
                  <ul className="space-y-3 text-sm text-[#603F2E] font-light">
                    <li><a href="#historia" className="hover:text-[#7F7C51] transition-colors">Filosofía B.caapi</a></li>
                    <li><a href="#proceso" className="hover:text-[#7F7C51] transition-colors">Proceso de Diseño</a></li>
                    <li><a href="#contacto" className="hover:text-[#7F7C51] transition-colors">Tallas y Cuidado</a></li>
                    <li><a href="#contacto" className="hover:text-[#7F7C51] transition-colors">Políticas de Envío</a></li>
                  </ul>
                </div>
                <div className="space-y-4">
                  <h4 className="text-xs uppercase tracking-widest text-[#8F7D63] font-bold">Oficina de Arte</h4>
                  <p className="text-sm text-[#D7CAA8] font-light leading-relaxed">Santo Domingo, República Dominicana.<br />Hecho a mano en el caribe, inspirado en la selva.</p>
                  <div className="pt-2">
                    <span className="text-xs uppercase tracking-wider text-[#7F7C51] font-bold block">Soporte Express</span>
                    <a href={`https://wa.me/${B_CAAPI_DATA.brandInfo.whatsapp}`} className="text-sm text-[#603F2E] hover:text-[#7F7C51] hover:underline block mt-1">{B_CAAPI_DATA.brandInfo.whatsappDisplay}</a>
                  </div>
                </div>
              </div>
              <div className="max-w-7xl mx-auto px-6 py-8 border-t border-[#D7CAA8]/10 flex flex-col sm:flex-row items-center justify-between text-xs text-[#D7CAA8]/60 font-light gap-4">
                <p>© {new Date().getFullYear()} B.caapi ({B_CAAPI_DATA.brandInfo.domain}). Todos los derechos reservados.</p>
                <p className="flex items-center space-x-1"><span>Diseño artesanal, intención sagrada</span><span className="text-[#7F7C51]">🌿</span></p>
              </div>
            </footer>

            <a
              href={`https://wa.me/${B_CAAPI_DATA.brandInfo.whatsapp}?text=Hola,%20me%20gustar%C3%ADa%20conocer%20las%20piezas%20disponibles%20de%20B.caapi.`}
              target="_blank"
              rel="noreferrer"
              className="fixed bottom-6 left-6 z-40 bg-[#595C4E] hover:bg-[#7F7C51] text-white p-4 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center border border-white/15"
              aria-label="Contactar por WhatsApp"
            >
              <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
                <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.73-1.455L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.59 1.98 14.122.955 11.5.954 6.07.954 1.646 5.325 1.642 10.754c-.001 1.702.449 3.361 1.301 4.82L1.933 20.35l4.714-1.196zm11.385-4.614c-.29-.145-1.711-.844-1.976-.94-.266-.097-.459-.145-.653.145-.193.29-.749.94-.917 1.133-.169.193-.338.217-.628.072-.29-.145-1.226-.452-2.335-1.441-.863-.77-1.446-1.72-1.615-2.01-.169-.29-.018-.447.127-.591.131-.13.29-.338.435-.507.145-.169.193-.29.29-.483.097-.193.048-.361-.024-.506-.072-.145-.653-1.573-.895-2.152-.235-.567-.475-.49-.653-.499-.169-.008-.362-.01-.555-.01-.193 0-.507.072-.772.361-.266.29-1.014.991-1.014 2.415 0 1.424 1.038 2.802 1.182 2.995.145.193 2.043 3.12 4.949 4.375.691.299 1.231.478 1.652.612.694.221 1.327.19 1.827.115.556-.084 1.711-.699 1.952-1.374.24-.675.24-1.253.169-1.374-.073-.121-.266-.193-.556-.338z" />
              </svg>
            </a>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
